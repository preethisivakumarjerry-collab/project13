<!DOCTYPE html>
<html lang="en">
<head>
  <title>Advanced Color Palette</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* Body */
body{
    background:linear-gradient(to right,#eef2f7,#e3f2fd);
    font-family:"Segoe UI",sans-serif;
    transition:0.5s ease;
}

/* Dark Mode */
.dark-mode{
    background:#121212 !important;
    color:white;
}

/* Card */
.card-box{
    border-radius:12px;
    overflow:hidden;
    transition:0.3s;
    animation:fadeUp 0.8s ease;
    cursor:pointer;
}

.card-box:hover{
    transform:translateY(-10px) scale(1.03);
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* Click Animation */
.card-box:active{
    transform:scale(0.95);
}

/* Glow */
.active-box{
    box-shadow:0 0 20px gold;
}

/* Color Box */
.color-box{
    padding:40px;
    color:white;
    font-weight:bold;
    text-align:center;
    font-size:18px;
}

.light-text{
    color:black;
}

/* Animation */
@keyframes fadeUp{
    from{opacity:0; transform:translateY(40px);}
    to{opacity:1; transform:translateY(0);}
}

/* Toggle Button */
.toggle-btn{
    position:fixed;
    top:20px;
    right:20px;
    border:none;
    padding:8px 15px;
    border-radius:20px;
    background:black;
    color:white;
}

.dark-mode .toggle-btn{
    background:white;
    color:black;
}

</style>

</head>

<body>

<button class="toggle-btn" onclick="toggleMode()">🌙 Mode</button>

<div class="container py-5">

<h2 class="text-center mb-4">Bootstrap Color Palette</h2>

<div class="row g-4">

<div class="col-md-4"><div class="card card-box" onclick="changeColor(this,'#0d6efd')"><div class="color-box bg-primary">PRIMARY</div></div></div>

<div class="col-md-4"><div class="card card-box" onclick="changeColor(this,'#6c757d')"><div class="color-box bg-secondary">SECONDARY</div></div></div>

<div class="col-md-4"><div class="card card-box" onclick="changeColor(this,'#198754')"><div class="color-box bg-success">SUCCESS</div></div></div>

<div class="col-md-4"><div class="card card-box" onclick="changeColor(this,'#dc3545')"><div class="color-box bg-danger">DANGER</div></div></div>

<div class="col-md-4"><div class="card card-box" onclick="changeColor(this,'#ffc107')"><div class="color-box bg-warning light-text">WARNING</div></div></div>

<div class="col-md-4"><div class="card card-box" onclick="changeColor(this,'#0dcaf0')"><div class="color-box bg-info light-text">INFO</div></div></div>

<div class="col-md-4"><div class="card card-box" onclick="changeColor(this,'#f8f9fa')"><div class="color-box bg-light light-text">LIGHT</div></div></div>

<div class="col-md-4"><div class="card card-box" onclick="changeColor(this,'#212529')"><div class="color-box bg-dark">DARK</div></div></div>

<div class="col-md-4"><div class="card card-box" onclick="changeColor(this,'#ffffff')"><div class="color-box bg-white light-text border">WHITE</div></div></div>

</div>

</div>

<script>

/* Dark Mode */
function toggleMode(){
    document.body.classList.toggle("dark-mode");
}

/* Change Full Background */
function changeColor(box,color){

    // Glow effect
    document.querySelectorAll(".card-box").forEach(b=>{
        b.classList.remove("active-box");
    });
    box.classList.add("active-box");

    // Change background
    document.body.style.background = color;
}

</script>

</body>
</html>
